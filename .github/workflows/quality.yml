name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - name: Test validation wrapper
        run: sh scripts/tests/check-workspace.sh

      - name: Check workspace
        run: sh scripts/check-workspace.sh

  generated-node:
    name: Generated Node (${{ matrix.stack }}, ${{ matrix.modules }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: vanilla-js
            modules: esm
          - stack: react-vite-ts
            modules: esm
          - stack: next-ts
            modules: esm
          - stack: express-ts
            modules: esm
          - stack: nest-ts
            modules: esm
          - stack: express-ts
            modules: commonjs
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Prepare Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate generated application
        env:
          TEMPLATE_ID: ${{ matrix.stack }}
          MODULE_SYSTEM: ${{ matrix.modules }}
        run: |
          if [ "$MODULE_SYSTEM" = commonjs ]; then
            python3 ferramentas/boilerplate/scripts/validate-generated.py --minimal --commonjs-only
          else
            python3 ferramentas/boilerplate/scripts/validate-generated.py --minimal --stacks "$TEMPLATE_ID"
          fi

  generated-python:
    name: Generated Python (FastAPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
      UV_PYTHON: '3.13'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Prepare uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Prepare Python
        run: uv python install 3.13 --no-bin

      - name: Validate generated application
        run: python3 ferramentas/boilerplate/scripts/validate-generated.py --minimal --stacks python-fastapi
