[package]
name = "rust-boilerplate"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "boilerplate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
rustix = { version = "1.1", features = ["fs"] }
