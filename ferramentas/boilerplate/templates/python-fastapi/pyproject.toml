[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "python-dotenv==1.2.2"]

[dependency-groups]
dev = ["ruff==0.17.2", "pytest==9.1.1", "httpx==0.28.1"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI declares dependencies with Depends in function signatures.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.isort]
known-first-party = ["app"]
