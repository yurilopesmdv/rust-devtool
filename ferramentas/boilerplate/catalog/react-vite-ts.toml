id = "react-vite-ts"
role = "frontend"
language = "TypeScript"
framework = "React + Vite"
port = 5173
container_port = 8080
architecture = ""
status = "ready"
package_manager = "npm"
paths = ["src/app/", "src/pages/", "src/components/", "src/features/", "src/services/", "src/styles/", "docs/"]
capabilities = ["github-actions", "compose", "kubernetes", "prometheus-grafana-container"]
module_systems = ["esm"]
install = ["npm", "ci"]

[[requirements]]
command = "node"
args = ["--version"]
purpose = "Instalar e executar a aplicação; não é necessário para planejar"

[[requirements]]
command = "npm"
args = ["--version"]
purpose = "Instalar e executar a aplicação; não é necessário para planejar"

[conditional_paths]
compose = ["Dockerfile", ".dockerignore"]
github-actions = [".ci/check.sh"]
