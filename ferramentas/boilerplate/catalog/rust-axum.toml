id = "rust-axum"
role = "backend"
language = "Rust"
framework = "Axum + Tokio"
port = 3000
container_port = 3000
integration_adapter = "rust-axum"
architecture = "layered"
status = "ready"
package_manager = "cargo"
paths = ["src/modules/example/", "tests/", "docs/"]
capabilities = ["migrations-dbmate", "compose", "kubernetes", "postgres", "mongodb", "redis", "vault", "prometheus-grafana"]
module_systems = []
install = ["cargo", "fetch", "--locked"]

[[requirements]]
command = "rustc"
args = ["--version"]
purpose = "Instalar e executar a aplicação; não é necessário para planejar"

[[requirements]]
command = "cargo"
args = ["--version"]
purpose = "Instalar e executar a aplicação; não é necessário para planejar"

[[requirements]]
command = "rustfmt"
args = ["--version"]
purpose = "Formatar os fontes compostos antes de salvar; rustup component add rustfmt"

[conditional_paths]
compose = ["Dockerfile", ".dockerignore"]
postgres = ["src/infrastructure/database.rs", "src/modules/example/repositories/"]
mongodb = ["src/infrastructure/database.rs", "src/modules/example/repositories/"]
redis = ["src/infrastructure/cache.rs"]
vault = ["src/infrastructure/config.rs"]
prometheus-grafana = ["src/infrastructure/metrics.rs"]
migrations-dbmate = ["scripts/migrate.sh", "migrations/sql/", "docs/MIGRATIONS.md"]
