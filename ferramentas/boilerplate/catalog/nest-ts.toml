id = "nest-ts"
role = "backend"
language = "TypeScript"
framework = "NestJS"
port = 3000
container_port = 3000
integration_adapter = "node-nest"
architecture = "layered"
status = "ready"
package_manager = "npm"
paths = ["src/config/", "src/common/middlewares/", "src/modules/example/", "tests/", "docs/"]
capabilities = ["github-actions", "migrations-mongodb-native", "migrations-dbmate", "compose", "kubernetes", "postgres", "mongodb", "redis", "vault", "prometheus-grafana"]
module_systems = ["esm"]
install = ["npm", "ci"]

[[requirements]]
command = "node"
args = ["--version"]
purpose = "Instalar e executar a aplicação; não é necessário para planejar"

[[requirements]]
command = "npm"
args = ["--version"]
purpose = "Instalar e executar a aplicação; não é necessário para planejar"

[conditional_paths]
compose = ["Dockerfile", ".dockerignore"]
postgres = ["src/infrastructure/database/", "src/modules/example/repositories/"]
mongodb = ["src/infrastructure/database/", "src/modules/example/repositories/"]
redis = ["src/infrastructure/cache/"]
vault = ["src/config/env.ts"]
prometheus-grafana = ["src/infrastructure/observability/"]
migrations-dbmate = ["scripts/migrate.sh", "migrations/sql/", "docs/MIGRATIONS.md"]
migrations-mongodb-native = ["migrations/mongo/", "docs/MIGRATIONS.md"]
github-actions = [".ci/check.sh"]
