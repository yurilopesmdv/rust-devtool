id = "next-ts"
role = "frontend"
language = "TypeScript"
framework = "Next.js"
port = 3001
container_port = 3001
integration_adapter = "node-next"
architecture = ""
status = "ready"
package_manager = "npm"
paths = ["src/app/", "src/components/", "src/features/", "src/services/", "docs/"]
capabilities = ["github-actions", "compose", "kubernetes", "prometheus-grafana"]
module_systems = ["esm"]
install = ["npm", "ci"]

[[requirements]]
command = "node"
args = ["--version"]
purpose = "Instalar e executar a aplicação; não é necessário para planejar"

[[requirements]]
command = "npm"
args = ["--version"]
purpose = "Instalar e executar a aplicação; não é necessário para planejar"

[conditional_paths]
compose = ["Dockerfile", ".dockerignore"]
github-actions = [".ci/check.sh"]
